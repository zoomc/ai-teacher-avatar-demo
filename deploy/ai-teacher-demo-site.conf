# AI Teacher Avatar Demo static site subdirectory (managed by release workflow)
# Placeholders: __SITE_NO_SLASH__, __SITE_PATH__, __RELEASE_ROOT__ (filled by release.yml)
location = __SITE_NO_SLASH__ { return 301 __SITE_PATH__; }
location __SITE_PATH__ {
    alias __RELEASE_ROOT__/web/current/;
    index index.html;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob: data:; worker-src 'self' blob:; connect-src 'self' https: wss: blob:; manifest-src 'self'; form-action 'self'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    try_files $uri $uri/ __SITE_PATH__index.html;
}
